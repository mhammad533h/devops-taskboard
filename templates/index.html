<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevOps Taskboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <header><span class="eyebrow">DEVOPS LAB PROJECT</span><h1>Taskboard</h1>
      <p>A small task list backed by PostgreSQL and Docker volumes.</p></header>
    <section class="panel" aria-label="Tasks">
      <form id="add-form" class="add-form">
        <label for="task-title">New task</label>
        <div class="input-row"><input id="task-title" name="title" maxlength="160" required placeholder="What needs to be done?">
          <button type="submit">Add task</button></div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="task-list">
        {% for task in tasks %}
        <li data-id="{{ task.id }}" class="{{ 'done' if task.completed else '' }}">
          <button class="toggle" type="button" aria-label="Toggle {{ task.title }}">{{ '✓' if task.completed else '○' }}</button>
          <span class="task-title">{{ task.title }}</span>
        </li>
        {% endfor %}
      </ul>
      <p id="empty" {% if tasks %}hidden{% endif %}>No tasks yet. Add one above.</p>
    </section>
    <footer>Flask API · PostgreSQL · Docker Compose</footer>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
